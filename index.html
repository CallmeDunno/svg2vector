<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG → Android Vector Drawable</title>
  <meta name="description" content="Chuyển đổi SVG sang Android VectorDrawable XML ngay trên trình duyệt: hỗ trợ gradient, đường cong, clip-path, CSS, use/symbol.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f9d58'/%3E%3Cpath d='M8 22L16 8l8 14' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#0f9d58"/>
        <path d="M8 22L16 8l8 14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="8" cy="22" r="2.6" fill="#b7f5d0"/><circle cx="24" cy="22" r="2.6" fill="#b7f5d0"/><circle cx="16" cy="8" r="2.6" fill="#b7f5d0"/>
      </svg>
      <div>
        <h1>SVG → Vector Drawable</h1>
        <p>Chuyển SVG sang Android VectorDrawable XML</p>
      </div>
    </div>
  </header>

  <main class="app">
    <section class="toolbar">
      <div class="group">
        <button id="btnPaste" class="btn primary" type="button" title="Dán SVG từ bộ nhớ tạm (hoặc nhấn Ctrl+V bất kỳ đâu trên trang)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v2H9zM7 5H5v16h14V5h-2v3H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          Dán SVG
        </button>
        <label class="btn" for="fileInput" title="Mở file .svg">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          Mở file…
        </label>
        <input type="file" id="fileInput" accept=".svg,image/svg+xml" hidden>
        <button id="btnClear" class="btn ghost" type="button">Xoá</button>
      </div>
      <div class="group options">
        <label>Độ chính xác
          <select id="optPrecision" class="select">
            <option value="auto">Tự động</option>
            <option value="1">1 số lẻ</option>
            <option value="2">2 số lẻ</option>
            <option value="3">3 số lẻ</option>
            <option value="4">4 số lẻ</option>
            <option value="5">5 số lẻ</option>
            <option value="6">6 số lẻ</option>
          </select>
        </label>
        <label>Kích thước
          <input id="optWidth" class="num" type="number" min="0" step="any" placeholder="tự động" aria-label="Chiều rộng (dp)">
          <span>×</span>
          <input id="optHeight" class="num" type="number" min="0" step="any" placeholder="tự động" aria-label="Chiều cao (dp)">
          <span>dp</span>
        </label>
      </div>
    </section>

    <section class="grid">
      <article class="panel">
        <header class="panel-head">
          <h2>Xem trước SVG</h2>
          <span class="meta" id="svgMeta"></span>
          <span class="spacer"></span>
          <div class="seg" id="bgSeg" role="group" aria-label="Nền xem trước">
            <button type="button" data-bg="checker" title="Nền ô vuông">▦</button>
            <button type="button" data-bg="light" title="Nền trắng">□</button>
            <button type="button" data-bg="dark" title="Nền tối">■</button>
          </div>
        </header>
        <div class="stage" id="svgStage">
          <img id="svgImg" alt="Xem trước SVG" hidden>
          <div class="empty" id="svgEmpty">Dán SVG (Ctrl+V) hoặc kéo thả file .svg vào trang</div>
        </div>
      </article>

      <article class="panel">
        <header class="panel-head">
          <h2>Xem trước Vector</h2>
          <span class="badge" id="matchBadge" hidden></span>
          <span class="spacer"></span>
          <label class="toggle" title="Tô đỏ các điểm ảnh khác với SVG gốc">
            <input type="checkbox" id="diffToggle"> So sánh khác biệt
          </label>
        </header>
        <div class="stage" id="vdStage">
          <img id="vdImg" alt="Xem trước Vector Drawable" hidden>
          <canvas id="diffCanvas" hidden></canvas>
          <div class="empty" id="vdEmpty">Kết quả Vector Drawable sẽ hiển thị ở đây</div>
        </div>
      </article>

      <article class="panel code-panel">
        <header class="panel-head">
          <h2>Mã SVG</h2>
          <span class="meta" id="svgSize"></span>
        </header>
        <textarea id="svgInput" spellcheck="false" autocomplete="off" placeholder="&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 24 24&quot;&gt;…&lt;/svg&gt;"></textarea>
      </article>

      <article class="panel code-panel">
        <header class="panel-head">
          <h2>Mã Vector Drawable</h2>
          <span class="meta" id="xmlMeta"></span>
          <span class="spacer"></span>
          <button id="btnCopy" class="btn primary" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            Sao chép
          </button>
          <button id="btnCopyHeader" class="btn" type="button" title="Sao chép kèm dòng &lt;?xml version=&quot;1.0&quot; encoding=&quot;utf-8&quot;?&gt; ở đầu" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            Sao chép kèm &lt;?xml?&gt;
          </button>
          <button id="btnDownload" class="btn" type="button" disabled>Tải .xml</button>
        </header>
        <div class="warnings" id="warnings" hidden></div>
        <pre class="code" id="xmlOutput"><code id="xmlCode"></code></pre>
      </article>
    </section>
  </main>

  <div class="drop-overlay" id="dropOverlay" hidden><div>Thả file SVG vào đây</div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/geometry.js"></script>
  <script src="js/color.js"></script>
  <script src="js/converter.js"></script>
  <script src="js/vdrender.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
